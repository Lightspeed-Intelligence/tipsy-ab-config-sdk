[build-system]
requires = ["setuptools>=68,<80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tipsy-ab-config"
version = "0.14.1"
description = "Tipsy AB-config Python SDK — local config cache + abtest Compute client"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tipsy AB-config team" }]
license = { text = "MIT" }
keywords = ["abtest", "feature-flag", "config", "grpc", "tipsy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
    # The floor is dictated by the checked-in generated stubs, NOT by what the
    # SDK's own code needs: every ``_proto/**/*_pb2_grpc.py`` carries
    # ``GRPC_GENERATED_VERSION = '1.66.2'`` and raises RuntimeError at import on
    # anything lower. Declaring a lower floor here made the two disagree — a
    # consumer resolving to the declared floor failed on ``import
    # tipsy_ab_config``. ``tests/test_version_sync.py`` keeps the two in lockstep;
    # regenerating the stubs with a newer grpcio-tools requires bumping this pin.
    "grpcio>=1.66.2,<2",
    # 5.29.1 rather than 5.29: protobuf 5.29.0 was YANKED upstream
    # (protocolbuffers/protobuf#19430), so ``>=5.29`` named a floor that resolves
    # to a yanked artifact when pinned exactly. Range installs already skip it;
    # this makes the declared floor one that can actually be installed.
    "protobuf>=5.29.1,<7",
]

[project.urls]
Homepage = "https://github.com/Lightspeed-Intelligence/tipsy-ab-config-sdk"
Documentation = "https://github.com/Lightspeed-Intelligence/tipsy-ab-config-sdk/tree/main/sdk/python"
Source = "https://github.com/Lightspeed-Intelligence/tipsy-ab-config-sdk"
Issues = "https://github.com/Lightspeed-Intelligence/tipsy-ab-config-sdk/issues"
Changelog = "https://github.com/Lightspeed-Intelligence/tipsy-ab-config-sdk/blob/main/sdk/python/CHANGELOG.md"

[project.optional-dependencies]
fastapi = ["starlette>=0.36,<1"]
http = ["httpx>=0.27,<1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "grpcio-tools==1.66.2",
    "tomli; python_version < '3.11'",
    "httpx>=0.27,<1",
    "build>=1.2",
    "wheel>=0.44",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tipsy_ab_config", "tipsy_ab_config.*"]

[tool.setuptools.package-data]
tipsy_ab_config = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["packaging: requires `python -m build` to run; opt-in only"]
addopts = "-m 'not packaging'"
